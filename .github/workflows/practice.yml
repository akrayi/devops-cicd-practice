name: Application-CI-Practice

on:
 push:
   branches:
     - main
     - develop

jobs:
  test-backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write 

    steps:
      - name: Downloard-code
        uses: actions/checkout@v6
      - name: Setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python-version
        run: python --version
      - name: Inspect-project
        run: |
          pwd
          ls
          cat requirements.txt
      - name: Install-dependencies
        run: python -m pip install -r requirements.txt
      - name: Run-test
        run: python -m unittest -v
      - name: Build-Docker-image
        run: docker build -t practice-app:v1 .
      - name: Login to Azure
        if: github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Login to ACR
        if: github.ref == 'refs/heads/main'
        run: az acr login --name akshaycicdregistry --resource-group cicd-practice-rg
      - name: Tag image for ACR
        if: github.ref == 'refs/heads/main'
        run: docker tag practice-app:v1 akshaycicdregistry-gwc8f9azf9g5aha4.azurecr.io/practice-app:v1
      - name: Push image to ACR
        if: github.ref == 'refs/heads/main'
        run: docker push akshaycicdregistry-gwc8f9azf9g5aha4.azurecr.io/practice-app:v1
